# Builds the Windows and Linux programs and attaches them to a release.
#
# Tag a commit v1.0.0 and push the tag, or run it by hand from the Actions
# tab. Each program is built on the system it is for, because PyInstaller
# cannot cross-compile. The Linux one is built on Ubuntu 22.04 rather than
# the newest runner: a program built against an older glibc runs on newer
# distributions, and the reverse is not true.
#
# Actions are pinned to a commit rather than a tag, and PyInstaller to a
# version, so a release is built from exactly what was reviewed. The comment
# after each pin names the version it is.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# The build jobs only read the repository. Write access is given to the
# release job alone, which runs no third-party packages.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x86-64
            built: "dist/MSI BIOS Profile Tool.exe"
            asset: MSI-BIOS-Profile-Tool-windows-x86_64.exe
          - os: ubuntu-22.04
            label: Linux x86-64
            built: "dist/MSI BIOS Profile Tool"
            asset: msi-bios-profile-tool-linux-x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The tests need no firmware; they check the profile format code.
      - name: Tests
        run: python -m unittest discover tests -v

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build
        run: pyinstaller --noconfirm --clean "MSI BIOS Profile Tool.spec"

      - name: Name it for what it runs on
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"

      # It starts, knows its own version and carries the files it reads at
      # run time. There is no BIOS file here, so this is not a test of the
      # decoding, but it catches a bundle that is missing something.
      - name: Check the program runs
        shell: bash
        run: |
          chmod +x "dist/${{ matrix.asset }}" || true
          "./dist/${{ matrix.asset }}" --version
          "./dist/${{ matrix.asset }}" --check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach them to the release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      # For the provenance attestation: it is signed with a short-lived
      # certificate issued to this workflow run.
      id-token: write
      attestations: write
    steps:
      # For the release notes, which are a file in the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: built
          merge-multiple: true

      # So a download can be told apart from one that went wrong, and so a
      # bug report can say which program it is about.
      - name: Checksums
        run: |
          cd built
          sha256sum MSI-BIOS-Profile-Tool-* msi-bios-profile-tool-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Ties each program to the workflow run and the commit that built it,
      # signed by GitHub:  gh attestation verify <file> --repo <owner>/<repo>
      # Not available on a private repository owned by a user, and a release
      # is not worth failing over it.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        continue-on-error: true
        with:
          subject-path: |
            built/MSI-BIOS-Profile-Tool-*
            built/msi-bios-profile-tool-*

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la built
          gh release create "${GITHUB_REF_NAME}" built/* \
            --title "MSI BIOS Profile Tool ${GITHUB_REF_NAME#v}" \
            --notes-file .github/RELEASE.md \
            || gh release upload "${GITHUB_REF_NAME}" built/* --clobber
